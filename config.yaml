# GeoFUSE SentinelGuard — Configuration File
# All paths, hyperparameters, and operational parameters are defined here.
# Paths are relative to project root unless specified as absolute.

project:
  name: "GeoFUSE SentinelGuard"
  version: "0.1.0"
  description: "Trust-Aware Super Resolution Mapping for Medium-Resolution Satellite Imagery"

# Directory & Dataset Paths (No hardcoded credentials or invented external URLs)
paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  outputs_dir: "outputs"
  cache_dir: "outputs/demo_cache"
  aoi_geojson_path: "data/aoi.geojson"

# Hardware / Compute Settings
device:
  mode: "auto"  # Options: "auto", "cuda", "cpu"
  mixed_precision: true
  num_workers: 2

# Image Preprocessing & Tiling Hyperparameters
preprocessing:
  patch_size: 64         # Input patch size (pixels)
  stride: 32             # Tiling overlap stride
  normalize_method: "reflectance_percentile"  # percentile-based normalization
  clip_min_percentile: 1.0
  clip_max_percentile: 99.0
  bands:
    - "B02"  # Blue
    - "B03"  # Green
    - "B04"  # Red
    - "B08"  # NIR (10m)

# Super-Resolution Model Hyperparameters
model:
  architecture: "residual_srnet"  # Lightweight Residual SR architecture
  scale_factor: 2.5           # 2.5x Super-Resolution reaching 4.0m GSD from Sentinel-2 10m bands
  num_channels: 4             # 4-band input (B02, B03, B04, B08)
  num_features: 64            # Upgraded from 48 — richer multiscale representation on RTX 4060
  num_residual_blocks: 8      # Doubled from 4 — deeper network for high-frequency detail learning
  res_scale: 0.2              # Reduced res_scale for stable gradient flow in deeper network

# Training Hyperparameters
training:
  batch_size: 16              # Optimal for 8GB VRAM on RTX 4060
  epochs: 40                  # 40 epochs on GPU for full convergence
  learning_rate: 0.0004       # Tuned for AdamW with cosine annealing
  weight_decay: 0.0001
  loss: "compound_l1_sobel_fft_laplacian"  # 4-component loss: L1 + Sobel + FFT + Laplacian
  loss_weights:
    grad_weight: 1.5           # Sobel edge gradient & magnitude contrast matching
    fft_weight: 0.50           # FFT spectral magnitude loss (preserves upper octave frequencies)
    lap_weight: 2.00           # Laplacian second-order sharpness penalty
    var_weight: 1.00           # Edge variance matching (matches target sharpness distribution)
  save_best_only: true
  seed: 42

# Super-Resolution Ensemble (Uncertainty Proxy)
ensemble:
  enabled: true
  ensemble_size: 3            # Small ensemble trained sequentially
  member_seeds: [42, 101, 2024]
  sequential_training: true   # Train sequentially to preserve memory

# Verification & Stability Checks
verification:
  synthetic_degradation:
    enabled: true
    blur_kernel_size: 3
    downsample_factor: 2.5
    noise_std: 0.01
  perturbation_test:
    enabled: true
    noise_levels: [0.01, 0.02, 0.05]
    brightness_jitter_std: 0.02
    num_trials: 3
  spectral_consistency:
    ndvi_threshold: 0.05      # Flag patches with significant delta-NDVI
    band_ratio_tolerance: 0.1
    sensor_noise_floor: 0.03  # ESA Sentinel-2 MSI Level-2A radiometric deadband
  structural_consistency:
    ssim_threshold: 0.70
    edge_gradient_tolerance: 0.15
  evidence_fusion:
    # Heuristic weights for multi-evidence trust/risk fusion (must sum to 1.0)
    # NOTE: This is an empirical heuristic fusion, not a calibrated Bayesian posterior probability.
    weights:
      disagreement: 0.25   # Uncertainty proxy from ensemble variance
      stability: 0.25      # Input-perturbation sensitivity
      spectral: 0.25       # Radiometric/NDVI consistency
      structural: 0.25     # High-frequency edge/gradient consistency
    normalization: "minmax" # Normalizes each signal to [0, 1] to prevent scale dominance
    high_risk_threshold: 0.65  # Threshold above which pixels are categorized as low trust / high risk

# Downstream Task Scaffolding & Evaluation
downstream:
  task_type: "building_footprint_analysis"
  threshold: 0.35
  extractor: "morphological"   # Mathematical morphology (White Top-Hat + NDVI thresholding)
  morphology:
    tophat_kernel_size: 7      # Structural element kernel size (pixels)
    tophat_threshold: 25       # Minimum brightness contrast for built-up structures
    max_ndvi: 0.20             # Maximum NDVI to exclude vegetation
    min_area: 4                # Minimum component area (pixels) to filter noise
    max_area: 600              # Maximum component area (pixels) to exclude massive regions
  trust_partition_threshold: 0.85 # Threshold to separate high-trust from low-trust regions

# Interactive Streamlit Dashboard
dashboard:
  host: "localhost"
  port: 8501
  enable_caching: true

# Auditable Trust Receipt Configuration
trust_receipt:
  min_trust_score_threshold: 86.5   # Percentage threshold below which warning is flagged (nominal threshold)
  outputs_dir: "outputs/receipts"
